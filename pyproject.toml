[build-system]
requires = ["setuptools>=75,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-provider-risk-explorer"
version = "0.1.0"
description = "Provider-level Medicare claims risk demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Mayur Jindal" }]
dependencies = [
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.4.0",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "streamlit==1.66.1",
]

[project.optional-dependencies]
notebooks = ["notebook==7.6.4"]

[tool.setuptools.packages.find]
where = ["src"]
